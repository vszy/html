<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map with Current Location</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script>
        // Initialize map with temporary center (will update to user location)
        var map = L.map('map').setView([20, 78], 5);

        // Base layers
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data: &copy; OpenTopoMap'
        });

        var satellite = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors, HOT'
        });

        // Layer control
        var baseMaps = {
            "OpenStreetMap": osm,
            "Topographic": topo,
            "Satellite": satellite
        };
        L.control.layers(baseMaps).addTo(map);

        // Marker for search results
        var searchMarker;

        // Add city search control
        L.Control.geocoder({
            defaultMarkGeocode: false
        }).on('markgeocode', function(e) {
            var latlng = e.geocode.center;

            // Remove previous search marker
            if (searchMarker) map.removeLayer(searchMarker);

            searchMarker = L.marker(latlng).addTo(map)
                .bindPopup(e.geocode.name)
                .openPopup();

            map.setView(latlng, 13);
        }).addTo(map);

        // Try to get user's current location
        map.locate({setView: true, maxZoom: 13});

        // When location found, add marker
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("You are here").openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }

        map.on('locationfound', onLocationFound);

        // Handle location error
        function onLocationError(e) {
            alert("Could not get your location: " + e.message);
        }

        map.on('locationerror', onLocationError);
    </script>
</body>
</html>
